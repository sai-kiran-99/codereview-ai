# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets are marked sync: false, so Render asks for them in the dashboard (never stored in git).
services:
  - type: web
    name: codereview-ai-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev: NODE_ENV=production makes npm skip devDependencies, but tsc and @types are needed to build
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # 3.8-flash was overloaded at launch (503 / 45 s silence); 3.6 answers in ~2 s.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://codereview-ai.vercel.app
